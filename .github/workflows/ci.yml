name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,data]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Verify frozen extractors
        run: driftlab verify-extractors
      - name: Tests (mock backend only; GPU/torch tests are marked slow)
        run: pytest -m "not slow" -q
