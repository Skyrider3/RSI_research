[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftlab"
version = "0.1.0"
description = "Measuring reference staleness, environment-drift inflation and false promotions in self-improving LLM agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "RSI research team" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.46", "accelerate>=0.30"]
vllm = ["vllm>=0.6"]
ui = ["streamlit>=1.40", "plotly>=5.20"]
data = ["huggingface_hub>=0.23", "pyarrow>=15"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "hypothesis>=6.100", "ruff>=0.5", "nbformat>=5.9"]

[project.scripts]
driftlab = "driftlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
driftlab = ["prompts/*.txt", "prompts/*.yaml", "store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: needs torch / model downloads or long runtimes (deselect with -m 'not slow')",
]
timeout = 600

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"tests/**" = ["B011"]
